<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namba Family Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="chat-shell">

  <div class="chat-topbar">
    <div class="avatar-mini"><img id="myAvatar" src="" alt="me"></div>
    <div class="title-block">
      <h1>Namba Family</h1>
      <div class="online-line"><span class="dot-live"></span><span id="onlineCountText">connecting…</span></div>
    </div>
    <button class="icon-btn" id="logoutBtn" title="Logout">⏻</button>
  </div>

  <div class="online-strip" id="onlineStrip"></div>

  <div class="messages-area" id="messagesArea">
    <div class="empty-state" id="emptyState">
      <div class="glyph">💬</div>
      <div>Innum message ehum illa.<br>Family ku first message anupunga!</div>
    </div>
  </div>

  <div class="composer">
    <div style="position:relative;">
      <div class="emoji-pop" id="emojiPop"></div>
      <div class="composer-row">
        <button class="icon-btn" id="emojiBtn" style="width:34px;height:34px;font-size:18px;">😊</button>
        <textarea id="msgInput" placeholder="Message type pannunga…" rows="1" maxlength="500"></textarea>
        <button class="send-btn" id="sendBtn" title="Send">➤</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
