<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namba Family</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="orb-field">
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
  <div class="orb orb--4"></div>
  <div class="orb orb--5"></div>
  <div class="orb orb--6"></div>
</div>

<div class="screen">
  <div class="card">
    <span class="brand-eyebrow">Private space</span>
    <h1 class="brand-title">Namba Family</h1>
    <p class="brand-sub">Family code &amp; password podunga, ulla varalam.</p>

    <form id="gateForm" autocomplete="off">
      <div class="field">
        <label for="familyCode">Family Code</label>
        <input type="text" id="familyCode" placeholder="Enter family code" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="familyPassword">Password</label>
        <input type="password" id="familyPassword" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="gateBtn">Open the door →</button>
      <div class="error-msg" id="gateError">Code or password thappu irukku. Try again.</div>
    </form>

    <div class="foot-link">Namma family alla? <a href="admin.html">Admin login</a></div>
  </div>
</div>

<script src="js/gate.js"></script>
</body>
</html>
