<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaru neenga? · Namba Family</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💜</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="orb-field">
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>
  <div class="orb orb--4"></div>
  <div class="orb orb--5"></div>
  <div class="orb orb--6"></div>
</div>

<div class="member-wrap">
  <div class="member-header">
    <div class="group-photo-frame">
      <img src="assets/group.jpg" alt="Namba Family group photo">
    </div>
    <span class="brand-eyebrow">Step 2</span>
    <h1 class="brand-title" style="font-size:26px;">Neenga yaru?</h1>
    <p class="brand-sub" style="margin-bottom:0;">Unga photo click pannunga</p>
  </div>

  <div class="member-grid" id="memberGrid"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-photo"><img id="modalPhoto" src="" alt=""></div>
    <h3 id="modalName"></h3>
    <p class="role" id="modalRole"></p>
    <div class="field" style="text-align:left;">
      <label for="memberPassword">Password</label>
      <input type="password" id="memberPassword" placeholder="Unga password podunga" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="memberLoginBtn">Login</button>
    <div class="error-msg" id="memberError">Password thappu irukku!</div>
    <button class="btn btn-ghost" id="modalCloseBtn" style="margin-top:10px;">Cancel</button>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
